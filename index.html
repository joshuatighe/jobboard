<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JobBoard: jobs ranked by how well they fit you, and a hiring pipeline that keeps candidates in the loop." />
    <meta name="theme-color" content="#7c3aed" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Uses next-themes' storageKey.
      try {
        const t = localStorage.getItem('jobboard-theme')
        const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <title>JobBoard · Hiring, minus the noise</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
